<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDE 02</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

    <header>
        <h1>Contador e Galeria</h1>

    </header>
    <main>
        <section>
            <h2>Contador Interativo</h2>
            <label for="passo">Passo</label>
            <input id="passo" type="number" placeholder="Informe o número do passo">
            <button id="incremento">+</button>
            <button id="decremento">-</button>
            <h4 id="resultado">0</h4>
        </section>

        <section>
            <h2>Galeria Responsiva</h2>
            <img id="principal" src="https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=800&q=80" alt="porsche">

            <div id="miniaturas">

            </div>

        </section>
    </main>



    <script src="./js/script.js"></script>
</body>

</html>
