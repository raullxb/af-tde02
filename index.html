<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TDE 02</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <header>
        <h1>Contador e Galeria</h1>
        <nav>
            <button id="btn-tema">Alternar Tema</button>
        </nav>
    </header>

    <main>
        <section>
            <h2>Contador Interativo</h2>
            <label for="passo">Passo</label>
            <input id="passo" type="number" placeholder="Número do passo">
            <button id="decremento">-</button>
            <button id="incremento">+</button>

            <h4 id="resultado">0</h4>
        </section>

        <section>
            <h2>Galeria Responsiva</h2>
            <img id="principal" src="https://loremflickr.com/800/600/car?lock=10" alt="porsche">
            <div id="miniaturas"></div>
        </section>
    </main>

    <footer>
        <p>Raul Biazotto Neto - TDE 02</p>
    </footer>

    <script src="./js/script.js"></script>
</body>

</html>
